<fieldset class="cm-group-box cm-group-box--titled cm-group-box--collapsible" data-cm-controller="group-box">
  <legend class="cm-group-box__legend">
    <button
      type="button"
      class="cm-button cm-button--ghost cm-button--md cm-group-box__trigger"
      id="cm-group-box-v-0-trigger"
      aria-controls="cm-group-box-v-0-content"
      aria-expanded="true"
    >
      <span class="cm-button__leading">
        <svg
          class="cm-icon cm-icon--regular cm-icon--classic cm-group-box__icon"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          aria-hidden="true"
          focusable="false"
        >
          <polyline points="5.75 8.75 12 15 18.25 8.75"></polyline>
        </svg>
      </span>
      <span class="cm-button__label"><span class="cm-group-box__title">Invoice details</span></span>
    </button>
  </legend>
  <div
    class="cm-group-box__content"
    id="cm-group-box-v-0-content"
    aria-labelledby="cm-group-box-v-0-trigger"
    role="region"
  >
    <label>Reference <input name="reference" value="PO-123" required /></label>
  </div>
</fieldset>
