<fieldset class="cm-theme-switch" data-cm-controller="theme-switch">
  <legend class="cm-theme-switch__legend">Theme</legend>
  <label class="cm-theme-switch__option"
    ><input class="cm-theme-switch__input" type="radio" name="cm-theme" value="light" /><span
      class="cm-theme-switch__label"
      >Light</span
    ></label
  >
  <label class="cm-theme-switch__option"
    ><input class="cm-theme-switch__input" type="radio" name="cm-theme" value="system" checked /><span
      class="cm-theme-switch__label"
      >System</span
    ></label
  >
  <label class="cm-theme-switch__option"
    ><input class="cm-theme-switch__input" type="radio" name="cm-theme" value="dark" /><span
      class="cm-theme-switch__label"
      >Dark</span
    ></label
  >
</fieldset>
