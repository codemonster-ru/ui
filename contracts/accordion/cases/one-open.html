<div class="cm-accordion" data-cm-controller="accordion">
  <section class="cm-accordion__item" data-cm-accordion-item="account">
    <h3 class="cm-accordion__heading">
      <button
        class="cm-accordion__trigger"
        id="faq-account-trigger"
        type="button"
        aria-expanded="true"
        aria-controls="faq-account-panel"
      >
        Account
      </button>
    </h3>
    <div class="cm-accordion__panel" id="faq-account-panel" role="region" aria-labelledby="faq-account-trigger">
      Account answer.
    </div>
  </section>
  <section class="cm-accordion__item" data-cm-accordion-item="billing">
    <h3 class="cm-accordion__heading">
      <button
        class="cm-accordion__trigger"
        id="faq-billing-trigger"
        type="button"
        aria-expanded="false"
        aria-controls="faq-billing-panel"
      >
        Billing
      </button>
    </h3>
    <div class="cm-accordion__panel" id="faq-billing-panel" role="region" aria-labelledby="faq-billing-trigger" hidden>
      Billing answer.
    </div>
  </section>
</div>
