<div class="cm-tabs" data-cm-controller="tabs" data-cm-tabs-value="billing">
  <div class="cm-tabs__list" role="tablist" aria-orientation="horizontal">
    <button
      class="cm-tabs__tab"
      id="settings-tab-general"
      type="button"
      role="tab"
      aria-controls="settings-panel-general"
      aria-selected="false"
      tabindex="-1"
    >
      General</button
    ><button
      class="cm-tabs__tab"
      id="settings-tab-advanced"
      type="button"
      role="tab"
      aria-controls="settings-panel-advanced"
      aria-selected="false"
      tabindex="-1"
      disabled
    >
      Advanced</button
    ><button
      class="cm-tabs__tab"
      id="settings-tab-billing"
      type="button"
      role="tab"
      aria-controls="settings-panel-billing"
      aria-selected="true"
      tabindex="0"
    >
      Billing
    </button>
  </div>
  <div
    class="cm-tabs__panel"
    id="settings-panel-general"
    role="tabpanel"
    aria-labelledby="settings-tab-general"
    tabindex="0"
    hidden
  >
    General settings.
  </div>
  <div
    class="cm-tabs__panel"
    id="settings-panel-advanced"
    role="tabpanel"
    aria-labelledby="settings-tab-advanced"
    tabindex="0"
    hidden
  >
    Advanced settings.
  </div>
  <div
    class="cm-tabs__panel"
    id="settings-panel-billing"
    role="tabpanel"
    aria-labelledby="settings-tab-billing"
    tabindex="0"
  >
    Billing settings.
  </div>
</div>
