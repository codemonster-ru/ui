<div
  class="cm-document-layout cm-document-layout--sidebar-content-aside"
  style="
    --cm-sticky-header-offset: var(--cm-layout-header-height);
    --cm-sticky-subheader-offset: var(--cm-layout-subheader-height);
    --cm-sticky-top-offset: calc(var(--cm-layout-header-height) + var(--cm-layout-subheader-height));
  "
  data-cm-controller="shell-metrics"
>
  <header class="cm-document-layout__header" data-cm-sticky-header>Guide</header>
  <div class="cm-document-layout__subheader" data-cm-sticky-subheader>Version 2</div>
  <main class="cm-document-layout__content">
    <aside class="cm-document-layout__sidebar">Chapters</aside>
    <section class="cm-document-layout__main">Body</section>
    <aside class="cm-document-layout__aside">On this page</aside>
  </main>
  <footer class="cm-document-layout__footer">Footer</footer>
</div>
