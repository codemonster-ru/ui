<div
  class="cm-app-shell cm-app-shell--sidebar-content-aside"
  style="
    --cm-sticky-header-offset: var(--cm-layout-header-height);
    --cm-sticky-subheader-offset: var(--cm-layout-subheader-height);
    --cm-sticky-top-offset: calc(var(--cm-layout-header-height) + var(--cm-layout-subheader-height));
  "
  data-cm-sidebar-collapsed="false"
  data-cm-controller="app-shell shell-metrics"
>
  <header class="cm-app-shell__header" data-cm-sticky-header>Product</header>
  <div class="cm-app-shell__subheader" data-cm-sticky-subheader>Filters</div>
  <div class="cm-app-shell__body">
    <aside class="cm-app-shell__sidebar">Navigation</aside>
    <main class="cm-app-shell__content">Content</main>
    <aside class="cm-app-shell__aside">Details</aside>
  </div>
  <footer class="cm-app-shell__footer">Footer</footer>
</div>
