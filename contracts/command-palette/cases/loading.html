<dialog class="cm-command-palette" id="global-command-palette" aria-labelledby="global-title" data-cm-controller="command-palette" data-cm-command-palette-state="closed" data-cm-command-palette-loading="true"><div class="cm-command-palette__surface"><header class="cm-command-palette__header"><h2 class="cm-command-palette__title" id="global-title">Global search</h2><button class="cm-command-palette__close" type="button" aria-label="Close" data-cm-command-palette-close>×</button></header><input class="cm-command-palette__input" type="search" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="global-listbox" aria-busy="true" placeholder="Search commands" value="" data-cm-command-palette-input autofocus><p class="cm-command-palette__status" role="status"><strong>Finding commands…</strong></p><ul class="cm-command-palette__list" id="global-listbox" role="listbox" hidden></ul><p class="cm-command-palette__idle" hidden>Start typing to search.</p><p class="cm-command-palette__empty" hidden>No commands found.</p></div></dialog>
