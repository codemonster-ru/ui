<section class="showcase-group">
  <header>
    <h2>Colors</h2>
    <p>Compare semantic colors in light and dark themes.</p>
  </header>
  <div class="showcase-grid">
    <article class="showcase-panel">
      <h3>Backgrounds</h3>
      <div class="showcase-swatch showcase-swatch--canvas">Canvas</div>
      <div class="showcase-swatch showcase-swatch--surface">Surface</div>
      <div class="showcase-swatch showcase-swatch--subtle">Subtle surface</div>
    </article>
    <article class="showcase-panel">
      <h3>Text</h3>
      <p>Primary text</p>
      <p class="showcase-muted">Muted text</p>
      <p><a class="cm-link" href="./colors/#status">Link color</a></p>
    </article>
    <article class="showcase-panel" id="status">
      <h3>Status</h3>
      <div class="showcase-matrix-row">
        <span class="cm-tag cm-tag--success">Success</span>
        <span class="cm-tag cm-tag--info">Info</span>
        <span class="cm-tag cm-tag--warning">Warning</span>
        <span class="cm-tag cm-tag--danger">Danger</span>
      </div>
    </article>
  </div>
</section>
