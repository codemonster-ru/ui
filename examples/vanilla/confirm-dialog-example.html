<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Confirm an action</title>
    <link rel="stylesheet" href="./tokens/tokens.css" />
    <link rel="stylesheet" href="./css/fonts.css" />
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <main class="cm-container">
      <h1>Draft actions</h1>
      <button id="archive-draft" class="cm-button cm-button--danger cm-button--md" type="button">
        <span class="cm-button__label">Archive draft</span>
      </button>
      <p id="archive-status" role="status"></p>
      <dialog
        id="confirm-archive"
        class="cm-dialog cm-dialog--sm cm-dialog--dividers"
        aria-labelledby="confirm-archive-title"
        aria-describedby="confirm-archive-description"
        data-cm-controller="dialog"
        data-cm-dialog-state="closed"
        data-cm-dialog-dismissible="true"
      >
        <div class="cm-dialog__surface">
          <header class="cm-dialog__header">
            <h2 id="confirm-archive-title" class="cm-dialog__title">Archive this draft?</h2>
            <button class="cm-dialog__close" type="button" aria-label="Close" data-cm-dialog-close>×</button>
          </header>
          <p id="confirm-archive-description" class="cm-dialog__description">The draft will move to your archive.</p>
          <div class="cm-dialog__body">
            <p id="archive-error" role="alert" hidden>The draft could not be archived. Try again.</p>
          </div>
          <footer class="cm-dialog__footer">
            <button id="cancel-archive" class="cm-button cm-button--secondary cm-button--md" type="button" autofocus>
              <span class="cm-button__label">Cancel</span>
            </button>
            <button id="approve-archive" class="cm-button cm-button--danger cm-button--md" type="button">
              <span class="cm-button__label">Archive</span>
            </button>
          </footer>
        </div>
      </dialog>
    </main>
    <script type="module">
      import { connectConfirmDialog } from './confirm-dialog-example.mjs';
      import { createRuntime } from './runtime.js';

      createRuntime().start(document);
      connectConfirmDialog(document, () => new Promise((resolve) => setTimeout(resolve, 700)));
    </script>
  </body>
</html>
