name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Type-aware rules resolve a sibling package through its built types, so ui-vue's imports
      # from ui-runtime/core are error-typed without this and no-unsafe-* fires on every one.
      - name: Build packages
        run: npm run build

      - name: Lint sources, styles, markup, and data
        run: npm run lint:all

      - name: Check formatting
        run: npm run format:check

  typecheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: npm run build

      - name: Typecheck workspaces
        run: npm run typecheck

      - name: Typecheck documented examples
        run: npm run check:docs:examples

  contracts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: npm run build

      - name: Check repository contracts
        run: npm run check:docs

      - name: Check CodeMonster UI contracts, accessibility, and visual fixtures
        run: npm run test:ui

      - name: Run release preparation tests
        run: npm run test:release-prep

      - name: Check that every verify step runs in CI
        run: npm run check:verify-coverage

  source-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run workspace tests from a clean build
        run: npm run test:ci-like

  packaging:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: npm run build

      - name: Check package contracts
        run: npm run check:package-contracts

      - name: Check package size budgets
        run: npm run check:ui-package-budgets

      - name: Check consumer tree shaking
        run: npm run check:consumer-tree-shaking

      - name: Dry-run publish artifacts
        run: npm run pack:all:dry-run

  packed-consumers:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: npm run build

      - name: Consume packed tarballs with npm, pnpm, and yarn
        run: npm run check:packed-consumers

  hygiene:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check that a clean install stays clean
        run: npm run check:clean-install

      - name: Audit release dependencies
        run: npm run audit:release

  visual:
    runs-on: macos-26
    env:
      CHROME_FOR_TESTING_VERSION: 151.0.7922.138

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: npm run build

      - name: Install pinned Chrome for visual checks
        run: |
          chrome_for_testing_path="${RUNNER_TEMP}/chrome-mac-arm64/Google Chrome for Testing.app/Contents/MacOS/Google Chrome for Testing"
          curl --fail --location --retry 3 --silent --show-error \
            "https://storage.googleapis.com/chrome-for-testing-public/${CHROME_FOR_TESTING_VERSION}/mac-arm64/chrome-mac-arm64.zip" \
            --output "${RUNNER_TEMP}/chrome-for-testing.zip"
          unzip -q "${RUNNER_TEMP}/chrome-for-testing.zip" -d "${RUNNER_TEMP}"
          "${chrome_for_testing_path}" --version

      - name: Verify cross-platform adapter parity
        run: |
          set -euo pipefail
          chrome_for_testing_path="${RUNNER_TEMP}/chrome-mac-arm64/Google Chrome for Testing.app/Contents/MacOS/Google Chrome for Testing"

          npm run visual:cross-platform:serve -- --port=5176 > "${RUNNER_TEMP}/codemonster-cross-platform-vite.log" 2>&1 &
          adapter_pid=$!
          trap 'kill "${adapter_pid}" 2>/dev/null || true' EXIT

          for attempt in {1..60}; do
            if curl --fail --silent 'http://127.0.0.1:5176/?case=button-default&platform=vue&theme=light' >/dev/null; then
              break
            fi
            if [ "${attempt}" -eq 60 ]; then
              cat "${RUNNER_TEMP}/codemonster-cross-platform-vite.log"
              exit 1
            fi
            sleep 1
          done

          result=0
          CHROME_PATH="${chrome_for_testing_path}" CM_PARITY_REPORT="${RUNNER_TEMP}/codemonster-pair-visual.json" node scripts/visual/check-vanilla-parity.mjs || result=1
          CHROME_PATH="${chrome_for_testing_path}" CM_PARITY_BEHAVIOR=1 node scripts/visual/check-vanilla-parity.mjs || result=1
          exit "$result"

      - name: Upload adapter parity diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: codemonster-adapter-parity-diagnostics
          path: |
            ${{ runner.temp }}/codemonster-pair-visual.json
            ${{ runner.temp }}/codemonster-cross-platform-vite.log
          if-no-files-found: ignore
