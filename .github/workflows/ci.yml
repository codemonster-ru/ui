name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The reference commit is the oracle for every comparison gate, and
          # the harnesses reach it with `git archive`. The default shallow
          # checkout does not contain it, which is why those gates had never
          # actually run here.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Fails in seconds rather than eight minutes into a parity run.
      - name: Verify the reference commit is available
        run: node ./scripts/ci/check-reference-available.mjs

      - name: Install dependencies
        run: npm ci

      # verify runs test:parity, whose Razor suites render through PHP and
      # packages/razor/vendor/autoload.php, so both have to exist before it.
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Install Razor adapter dependencies
        run: composer install --no-interaction --no-progress --working-dir=packages/razor

      - name: Verify repository
        run: npm run verify

      # Reference-based gates. These compare the working tree against the
      # historical implementation and are host-independent: byte comparisons and
      # jsdom suites, no recorded screenshots.
      - name: Verify against the reference implementation
        run: npm run baseline:ci

      - name: Verify the Razor adapter
        run: npm run razor:check

      # The clean three-way comparison and the mutation matrix must both pass,
      # for every migrated component. One harness, one comparator, one policy
      # engine: parity:check runs it per component.
      - name: Verify three-way parity for every migrated component
        run: npm run parity:check

      - name: Stage the Razor Composer artifact for the showcase
        run: npm run razor:package

      - name: Install Razor showcase dependencies
        run: composer install --no-interaction --no-progress --working-dir=examples/razor-showcase

      # Full-route check: the two real showcase applications, not the isolated
      # component. Proves both expose the same shared cases for every migrated
      # component and can hand a reader from one platform to the other.
      - name: Verify the showcase routes
        run: npm run showcase:routes

      - name: Dry-run publish artifacts
        run: npm run prepublish:all

  # M09: the Razor adapter has to be distributable, not just correct. This job
  # builds the Composer artifact, checks what it contains, installs it outside
  # the repository with no Node on the consumer PATH, and repeats the whole
  # thing from a clean `git archive` export.
  packaging:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Install dependencies
        run: npm ci

      - name: Verify the neutral asset boundary
        run: npm run check:asset-boundary

      - name: Validate the Composer artifact contents
        run: npm run check:razor-package

      - name: Prove an isolated packaged Composer consumer
        run: npm run check:razor-packaged-consumer

      - name: Prove the package from a clean exported tree
        run: npm run check:razor-clean-export

      - name: Upload the staged artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: razor-composer-artifact
          include-hidden-files: true
          path: .release/razor-package

  # Stored showcase hashes belong to their original darwin-arm64 environment.
  # Compare fresh immutable reference/current captures on this runner instead.
  # This job runs on every PR; it cannot rewrite the committed baseline.
  showcase-baseline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Verify the reference commit is available
        run: node ./scripts/ci/check-reference-available.mjs

      - name: Install dependencies
        run: npm ci

      - name: Reference to current showcase drift on the same runner
        run: npm run baseline:showcase:ci

      - name: Upload showcase comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: showcase-reference-comparison
          include-hidden-files: true
          path: |
            .baseline-artifacts/showcase-ci/capture-*.json
            .baseline-artifacts/showcase-ci/comparison.json
            .baseline-artifacts/showcase-ci/captures-*/
