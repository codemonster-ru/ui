name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify repository
        run: npm run verify

      - name: Dry-run publish artifacts
        run: npm run prepublish:all

  visual:
    needs: validate
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: npm run build

      - name: Install Razor visual runtime
        run: composer --working-dir=packages/razor update --no-dev --no-interaction --prefer-dist

      - name: Verify frozen showcase visuals
        env:
          SHOWCASE_CAPTURE: ${{ runner.temp }}/codemonster-showcase-current
          SHOWCASE_DIFF: ${{ runner.temp }}/codemonster-showcase-diff
          SHOWCASE_STATE_CAPTURE: ${{ runner.temp }}/codemonster-showcase-state-current
          SHOWCASE_STATE_DIFF: ${{ runner.temp }}/codemonster-showcase-state-diff
          CROSS_PLATFORM_CAPTURE: ${{ runner.temp }}/codemonster-cross-platform-current
          CROSS_PLATFORM_RAZOR_DIFF: ${{ runner.temp }}/codemonster-cross-platform-razor-diff
          CROSS_PLATFORM_RAZOR_FIXTURES: ${{ runner.temp }}/codemonster-cross-platform-razor.json
          CROSS_PLATFORM_VUE_DIFF: ${{ runner.temp }}/codemonster-cross-platform-vue-diff
        run: |
          set -euo pipefail

          npm run dev -w @codemonster-ru/vueforge-playground-example -- --host 127.0.0.1 --port 5175 > "${RUNNER_TEMP}/codemonster-showcase-vite.log" 2>&1 &
          vite_pid=$!
          npm run visual:cross-platform:razor-render -- --output="${CROSS_PLATFORM_RAZOR_FIXTURES}"
          npm run visual:cross-platform:serve -- --razor-fixtures="${CROSS_PLATFORM_RAZOR_FIXTURES}" --port=5176 > "${RUNNER_TEMP}/codemonster-cross-platform-vite.log" 2>&1 &
          adapter_pid=$!
          "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --remote-debugging-port=9226 --user-data-dir="${RUNNER_TEMP}/codemonster-showcase-chrome" --disable-gpu --no-first-run --no-default-browser-check about:blank > "${RUNNER_TEMP}/codemonster-showcase-chrome.log" 2>&1 &
          chrome_pid=$!

          cleanup() {
            kill "${vite_pid}" "${adapter_pid}" "${chrome_pid}" 2>/dev/null || true
          }
          trap cleanup EXIT

          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:5175/ >/dev/null && curl --fail --silent 'http://127.0.0.1:5176/?case=button-default&platform=vue&theme=light' >/dev/null && curl --fail --silent http://127.0.0.1:9226/json/version >/dev/null; then
              break
            fi
            if [ "${attempt}" -eq 60 ]; then
              cat "${RUNNER_TEMP}/codemonster-showcase-vite.log"
              cat "${RUNNER_TEMP}/codemonster-cross-platform-vite.log"
              cat "${RUNNER_TEMP}/codemonster-showcase-chrome.log"
              exit 1
            fi
            sleep 1
          done

          node scripts/visual/capture-showcase.mjs --origin=http://127.0.0.1:5175 --output="${SHOWCASE_CAPTURE}" --label=ci-current
          node scripts/visual/compare-showcase.mjs --baseline=visual-baselines/vueforge-showcase --current="${SHOWCASE_CAPTURE}" --diff="${SHOWCASE_DIFF}"
          npm run visual:showcase:states:capture -- --origin=http://127.0.0.1:5175 --output="${SHOWCASE_STATE_CAPTURE}" --label=ci-state-current
          npm run visual:showcase:states:compare -- --current="${SHOWCASE_STATE_CAPTURE}" --diff="${SHOWCASE_STATE_DIFF}"
          npm run visual:cross-platform:capture -- --origin=http://127.0.0.1:5176 --output="${CROSS_PLATFORM_CAPTURE}" --label=ci-actual-adapters
          node scripts/visual/compare-showcase.mjs --baseline=visual-baselines/vueforge-cross-platform --current="${CROSS_PLATFORM_CAPTURE}/vue" --diff="${CROSS_PLATFORM_VUE_DIFF}"
          node scripts/visual/compare-showcase.mjs --baseline=visual-baselines/vueforge-cross-platform --current="${CROSS_PLATFORM_CAPTURE}/razor" --diff="${CROSS_PLATFORM_RAZOR_DIFF}"

      - name: Upload showcase visual differences
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: codemonster-showcase-visual-diff
          path: |
            ${{ runner.temp }}/codemonster-showcase-current
            ${{ runner.temp }}/codemonster-showcase-diff
            ${{ runner.temp }}/codemonster-showcase-state-current
            ${{ runner.temp }}/codemonster-showcase-state-diff
            ${{ runner.temp }}/codemonster-cross-platform-current
            ${{ runner.temp }}/codemonster-cross-platform-vue-diff
            ${{ runner.temp }}/codemonster-cross-platform-razor-diff
            ${{ runner.temp }}/codemonster-cross-platform-vite.log
            ${{ runner.temp }}/codemonster-showcase-vite.log
            ${{ runner.temp }}/codemonster-showcase-chrome.log
          if-no-files-found: ignore
