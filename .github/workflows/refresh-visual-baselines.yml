name: Refresh Visual Baselines

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: macos-15
    env:
      CHROME_FOR_TESTING_VERSION: 151.0.7922.138

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: npm run build

      - name: Install Razor visual runtime
        run: composer --working-dir=packages/razor update --no-dev --no-interaction --prefer-dist

      - name: Install pinned Chrome for visual checks
        run: |
          chrome_for_testing_path="${RUNNER_TEMP}/chrome-mac-arm64/Google Chrome for Testing.app/Contents/MacOS/Google Chrome for Testing"
          curl --fail --location --retry 3 --silent --show-error \
            "https://storage.googleapis.com/chrome-for-testing-public/${CHROME_FOR_TESTING_VERSION}/mac-arm64/chrome-mac-arm64.zip" \
            --output "${RUNNER_TEMP}/chrome-for-testing.zip"
          unzip -q "${RUNNER_TEMP}/chrome-for-testing.zip" -d "${RUNNER_TEMP}"
          "${chrome_for_testing_path}" --version

      - name: Capture and commit baselines
        run: |
          set -euo pipefail
          chrome_for_testing_path="${RUNNER_TEMP}/chrome-mac-arm64/Google Chrome for Testing.app/Contents/MacOS/Google Chrome for Testing"
          showcase_capture="${RUNNER_TEMP}/codemonster-showcase-current"
          state_capture="${RUNNER_TEMP}/codemonster-showcase-state-current"
          cross_platform_capture="${RUNNER_TEMP}/codemonster-cross-platform-current"
          razor_fixtures="${RUNNER_TEMP}/codemonster-cross-platform-razor.json"

          npm run dev -w @codemonster-ru/vueforge-playground-example -- --host 127.0.0.1 --port 5175 > "${RUNNER_TEMP}/codemonster-showcase-vite.log" 2>&1 &
          vite_pid=$!
          npm run visual:cross-platform:razor-render -- --output="${razor_fixtures}"
          npm run visual:cross-platform:serve -- --razor-fixtures="${razor_fixtures}" --port=5176 > "${RUNNER_TEMP}/codemonster-cross-platform-vite.log" 2>&1 &
          adapter_pid=$!
          "${chrome_for_testing_path}" --headless=new --remote-debugging-port=9226 --user-data-dir="${RUNNER_TEMP}/codemonster-showcase-chrome" --disable-gpu --no-first-run --no-default-browser-check about:blank > "${RUNNER_TEMP}/codemonster-showcase-chrome.log" 2>&1 &
          chrome_pid=$!
          cleanup() { kill "${vite_pid}" "${adapter_pid}" "${chrome_pid}" 2>/dev/null || true; }
          trap cleanup EXIT

          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:5175/ >/dev/null && curl --fail --silent 'http://127.0.0.1:5176/?case=button-default&platform=vue&theme=light' >/dev/null && curl --fail --silent http://127.0.0.1:9226/json/version >/dev/null; then
              break
            fi
            if [ "${attempt}" -eq 60 ]; then exit 1; fi
            sleep 1
          done

          node scripts/visual/capture-showcase.mjs --origin=http://127.0.0.1:5175 --output="${showcase_capture}" --label=vueforge-reference
          npm run visual:showcase:states:capture -- --origin=http://127.0.0.1:5175 --output="${state_capture}" --label=vueforge-state-reference
          npm run visual:cross-platform:capture -- --origin=http://127.0.0.1:5176 --output="${cross_platform_capture}" --label=vueforge-cross-platform-reference
          node scripts/visual/compare-showcase.mjs --baseline="${cross_platform_capture}/vue" --current="${cross_platform_capture}/razor"

          cp -R "${showcase_capture}/." visual-baselines/vueforge-showcase/
          cp -R "${state_capture}/." visual-baselines/vueforge-showcase-states/
          cp -R "${cross_platform_capture}/vue/." visual-baselines/vueforge-cross-platform/
          npm exec -- prettier --write visual-baselines/*/manifest.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add visual-baselines
          git diff --cached --quiet || git commit -m 'Refresh visual baselines'
          git push origin main
