name: Release Package From Tag

on:
  push:
    tags:
      - '@*/*@*'

permissions:
  contents: write
  id-token: write

concurrency:
  group: vueforge-package-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Pin npm
        run: npm install --global npm@11.9.0

      - name: Install dependencies
        run: npm ci

      - name: Resolve release target from tag
        id: prep
        run: node scripts/ci/prepare-release-from-tag.mjs

      - name: Verify release graph and packed consumer
        run: npm run verify

      - name: Pack verified target
        run: |
          mkdir -p .release-artifacts
          npm pack -w "${{ steps.prep.outputs.package_name }}" --ignore-scripts --pack-destination .release-artifacts
          test -f ".release-artifacts/${{ steps.prep.outputs.tarball_name }}"

      - name: Inspect target tarball
        run: npm publish ".release-artifacts/${{ steps.prep.outputs.tarball_name }}" --dry-run --ignore-scripts --tag "${{ steps.prep.outputs.dist_tag }}"

      - name: Check existing registry version
        id: registry
        run: |
          package_spec="${{ steps.prep.outputs.package_name }}@${{ steps.prep.outputs.package_version }}"
          tarball=".release-artifacts/${{ steps.prep.outputs.tarball_name }}"

          if npm view "$package_spec" version >/dev/null 2>&1; then
            npm diff --diff="$package_spec" --diff="$tarball" --diff-name-only | sed '/^[[:space:]]*$/d' > .release-diff
            if test -s .release-diff; then
              cat .release-diff
              exit 1
            fi
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish package to npm
        if: steps.registry.outputs.published != 'true'
        run: npm publish ".release-artifacts/${{ steps.prep.outputs.tarball_name }}" --access public --provenance --tag "${{ steps.prep.outputs.dist_tag }}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ steps.prep.outputs.release_name }}
          body_path: ${{ steps.prep.outputs.release_notes_path }}
          prerelease: ${{ steps.prep.outputs.is_prerelease }}
          tag_name: ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
